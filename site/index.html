<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Max Gross — Pottery</title>
<meta name="description" content="Handmade pottery by Max Gross." />
<meta property="og:title" content="Max Gross — Pottery" />
<meta property="og:description" content="Handmade pottery by Max Gross." />
<meta property="og:image" content="/pots/cover.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #efede8;
    --ink: #1f1f1d;
    --muted: #75736d;
    --line: #d6d3cc;
    --clay: #9c6248;
    --tile: #e6e3dc;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1b1a; --ink: #e9e9e5; --muted: #96968f; --line: #353532; --clay: #c48c70; --tile: #232322; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 "Hanken Grotesk", system-ui, sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 72rem; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 640px) { .wrap { padding: 0 32px; } }

  header { padding: 72px 0 40px; }
  h1 { font: 300 clamp(2.4rem, 7vw, 4.2rem)/1.05 "Newsreader", Georgia, serif; letter-spacing: -0.02em; margin: 0; }
  .lede { max-width: 34rem; margin: 18px 0 0; color: var(--muted); font-size: 1.05rem; }
  .lede em { color: var(--clay); font-style: normal; }

  .grid { columns: 1; column-gap: 20px; padding-bottom: 24px; }
  @media (min-width: 640px) { .grid { columns: 2; } }
  @media (min-width: 1000px) { .grid { columns: 3; } }
  figure { break-inside: avoid; margin: 0 0 20px; }
  figure button { all: unset; display: block; width: 100%; cursor: zoom-in; border-radius: 6px; overflow: hidden; background: var(--tile); }
  figure button:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; }
  figure img { display: block; width: 100%; height: auto; transition: transform .6s ease; }
  figure button:hover img { transform: scale(1.015); }
  figcaption { padding: 8px 2px 0; font-size: .9rem; }
  figcaption span { color: var(--muted); }

  .contact { border-top: 1px solid var(--line); padding: 40px 0 64px; display: grid; gap: 8px; }
  .contact h2 { font: 300 1.8rem/1.2 "Newsreader", Georgia, serif; margin: 0 0 6px; }
  .contact p { margin: 0; color: var(--muted); max-width: 34rem; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .links a { text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; }
  .links a:hover { border-color: var(--clay); color: var(--clay); }
  footer { color: var(--muted); font-size: .8rem; padding-bottom: 32px; }

  .empty { color: var(--muted); padding: 40px 0; }

  /* Lightbox */
  dialog { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; width: 100vw; height: 100vh; }
  dialog::backdrop { background: rgb(0 0 0 / .88); }
  .lb { position: relative; width: 100%; height: 100%; display: grid; place-items: center; padding: 56px 16px; }
  .lb img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
  .lb p { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #ddd; font-size: .9rem; margin: 0; padding: 0 16px; }
  .lb button { position: absolute; background: none; border: 0; color: #eee; font: 400 1rem "Hanken Grotesk", sans-serif; cursor: pointer; padding: 12px 16px; }
  .lb .close { top: 8px; right: 8px; }
  .lb .prev { left: 4px; top: 50%; transform: translateY(-50%); font-size: 1.6rem; }
  .lb .next { right: 4px; top: 50%; transform: translateY(-50%); font-size: 1.6rem; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Max Gross</h1>
      <p class="lede">Handmade pottery: <em>cups, bowls and plates</em> made to be used every day, at the table and in the kitchen.</p>
    </header>

    <main>
      <section class="grid" id="grid" aria-label="Pots"></section>
    </main>

    <section class="contact" id="contact">
      <h2>Say hello</h2>
      <p>Interested in a piece, a set, or something made for your space? Pieces are available on request.</p>
      <div class="links">
        <a href="mailto:maxwellrgross@gmail.com?subject=Your%20pottery">Email</a>
        <a href="https://instagram.com/truetomax" target="_blank" rel="noopener">Instagram</a>
      </div>
    </section>

    <footer>© <span id="year"></span> Max Gross</footer>
  </div>

  <dialog id="lightbox" aria-label="Photo">
    <div class="lb">
      <button class="close" type="button" aria-label="Close">Close</button>
      <button class="prev" type="button" aria-label="Previous">‹</button>
      <img alt="" />
      <button class="next" type="button" aria-label="Next">›</button>
      <p></p>
    </div>
  </dialog>

<script>
  // The pots: add a line per photo (file in /pots). title and note are optional.
  const POTS = [
    // { src: "pots/01.jpg", title: "Tea bowl", note: "Stoneware, shino glaze" },
  ];

  const grid = document.getElementById("grid");
  const dlg = document.getElementById("lightbox");
  const big = dlg.querySelector("img");
  const cap = dlg.querySelector("p");
  let at = 0;

  function show(i) {
    at = (i + POTS.length) % POTS.length;
    const p = POTS[at];
    big.src = p.src;
    big.alt = p.title || "A pot by Max Gross";
    cap.textContent = [p.title, p.note].filter(Boolean).join(" · ");
  }

  if (!POTS.length) {
    grid.outerHTML = '<p class="empty">Photos coming soon.</p>';
  } else {
    POTS.forEach((p, i) => {
      const fig = document.createElement("figure");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("aria-label", "Open " + (p.title || "photo " + (i + 1)));
      const img = document.createElement("img");
      img.src = p.src;
      img.alt = p.title || "A pot by Max Gross";
      img.loading = i < 3 ? "eager" : "lazy";
      img.decoding = "async";
      if (p.w && p.h) { img.width = p.w; img.height = p.h; }
      btn.appendChild(img);
      btn.addEventListener("click", () => { show(i); dlg.showModal(); });
      fig.appendChild(btn);
      if (p.title || p.note) {
        const fc = document.createElement("figcaption");
        fc.innerHTML = (p.title ? p.title : "") + (p.note ? ' <span>' + p.note + "</span>" : "");
        fig.appendChild(fc);
      }
      grid.appendChild(fig);
    });
  }

  dlg.querySelector(".close").onclick = () => dlg.close();
  dlg.querySelector(".prev").onclick = () => show(at - 1);
  dlg.querySelector(".next").onclick = () => show(at + 1);
  dlg.addEventListener("click", (e) => { if (e.target === dlg || e.target.classList.contains("lb")) dlg.close(); });
  document.addEventListener("keydown", (e) => {
    if (!dlg.open) return;
    if (e.key === "ArrowLeft") show(at - 1);
    if (e.key === "ArrowRight") show(at + 1);
  });
  // Swipe on a phone.
  let x0 = null;
  dlg.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  dlg.addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) show(at + (dx < 0 ? 1 : -1));
    x0 = null;
  });
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
